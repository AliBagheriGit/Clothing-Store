<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Rose Pink to Deep Magenta -->
    <linearGradient id="glamourBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="40%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="glamourGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Pearl White Gradient for G -->
    <linearGradient id="pearlWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>

    <!-- Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#4c0519" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Base Rounded Rectangle (Squircle) -->
  <rect width="512" height="512" rx="120" fill="url(#glamourBg)" />

  <!-- Inner Golden Luxury Border -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="url(#glamourGold)" stroke-width="4" stroke-opacity="0.5" />
  
  <!-- Subtle Inner Dotted Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="8 6" />

  <!-- Glamour Monogram Group -->
  <g filter="url(#shadow)">
    <!-- Stylized Haute-Couture 'G' -->
    <path d="M 330 180 
             C 310 145, 275 130, 240 130 
             C 170 130, 125 185, 125 256 
             C 125 328, 170 382, 242 382 
             C 305 382, 348 345, 355 285 
             L 245 285 
             L 245 245 
             L 395 245 
             C 395 365, 320 422, 240 422 
             C 140 422, 80 348, 80 256 
             C 80 162, 145 90, 242 90 
             C 292 90, 345 112, 375 155 
             Z" 
          fill="url(#pearlWhite)" />

    <!-- Crown / Tiara Accent above 'G' -->
    <path d="M 210 95 L 222 72 L 242 86 L 256 60 L 270 86 L 290 72 L 302 95 Z" 
          fill="url(#glamourGold)" />
          
    <!-- Sparkle Diamond Star (✦) Top Right -->
    <path d="M 385 130 
             Q 385 155, 360 155 
             Q 385 155, 385 180 
             Q 385 155, 410 155 
             Q 385 155, 385 130 Z" 
          fill="url(#glamourGold)" />

    <!-- Small Sparkle Bottom Left -->
    <path d="M 120 370 
             Q 120 385, 105 385 
             Q 120 385, 120 400 
             Q 120 385, 135 385 
             Q 120 385, 120 370 Z" 
          fill="url(#glamourGold)" 
          opacity="0.85" />
  </g>
</svg>
